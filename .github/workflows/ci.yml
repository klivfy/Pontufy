# ═══════════════════════════════════════════════════════════════════════════
# CI mínimo do Pontufy — gate de qualidade por PR.
#
# Regras:
#  • NUNCA roda migração nem seed aqui. Schema é aplicado fora do build
#    (ver PLANO-DE-ACAO.md, F2.7). O `npm run build` chama scripts/migrate.mjs,
#    que sem DATABASE_URL apenas avisa e segue.
#  • `AUTH_SECRET` é dummy: o build não assina sessão. Nenhum segredo real
#    entra em arquivo de workflow.
#  • O gate de lint usa baseline congelado (`npm run lint:ci`): falha se o
#    número de problemas AUMENTAR, não se ainda houver dívida histórica.
# ═══════════════════════════════════════════════════════════════════════════
name: CI

on:
  pull_request:
  push:
    branches: [main, 'sec/**', 'feat/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck · Lint · Audit · Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # Dummy: suficiente para `next build`, inútil como credencial.
      AUTH_SECRET: ci-build-only-not-a-real-secret-0000000000
      # `prisma validate`/`generate` exigem que as variáveis referenciadas no
      # schema existam. São valores falsos (não há conexão neste job) e não
      # vazam nada: o `.env.example` já publica placeholders equivalentes.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (workspaces)
        run: npm ci

      - name: Prisma client
        run: npx prisma generate --schema apps/pontufy/prisma/schema.prisma

      - name: Schema Prisma válido
        run: npx prisma validate --schema apps/pontufy/prisma/schema.prisma

      # C3 — domínio puro: sem banco, sem serviço, roda em ~1s.
      - name: Testes unitários (domínio)
        run: npm run test:unit -w apps/pontufy

      - name: Typecheck
        run: npm run typecheck -w apps/pontufy

      - name: Lint (baseline)
        run: npm run lint:ci -w apps/pontufy

      - name: Autorização declarada por rota
        run: npm run check:routes -w apps/pontufy

      - name: Dependências vulneráveis (produção)
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build -w apps/pontufy

  # ── E2E — banco e cache efêmeros (C2 da ESTRATEGIA-ESTRUTURAL) ──────────────
  # O app usa o cliente REST do Upstash, não o protocolo Redis. Por isso há um
  # proxy HTTP (serverless-redis-http) entre o runner e o Redis: sem ele,
  # UPSTASH_REDIS_REST_URL apontaria para um servidor que não fala REST e todo
  # login cairia em fail-closed (503).
  e2e:
    name: Playwright (integração de API)
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pontufy
          POSTGRES_PASSWORD: pontufy
          POSTGRES_DB: pontufy
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pontufy" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
      upstash-proxy:
        image: hiett/serverless-redis-http:latest
        env:
          SRH_MODE: env
          SRH_TOKEN: ci-upstash-token
          SRH_CONNECTION_STRING: redis://redis:6379
        ports: ['8079:80']
    env:
      DATABASE_URL: postgresql://pontufy:pontufy@localhost:5432/pontufy
      DIRECT_URL: postgresql://pontufy:pontufy@localhost:5432/pontufy
      UPSTASH_REDIS_REST_URL: http://localhost:8079
      UPSTASH_REDIS_REST_TOKEN: ci-upstash-token
      AUTH_SECRET: ci-e2e-only-not-a-real-secret-00000000000
      AUTH_URL: http://127.0.0.1:3100
      NEXTAUTH_URL: http://127.0.0.1:3100
      CRON_SECRET: ci-e2e-cron-secret-000000000000
      AFFILIATE_WEBHOOK_SECRET: ci-e2e-affiliate-secret-00000000
      LOMADEE_POSTBACK_SECRET: ci-e2e-lomadee-secret-0000000
      CERTIFICATE_VERIFICATION_SECRET: ci-e2e-certificate-secret-000000
      PW_BASE_URL: http://127.0.0.1:3100
      # A suíte faz ~30 logins do mesmo IP (127.0.0.1). Sem elevar o limite,
      # o rate limit de login (5/15min) derruba 20 testes com 429.
      AUTH_RATE_LIMIT_MAX: '1000'
      ALLOW_DESTRUCTIVE_TESTS: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma generate --schema apps/pontufy/prisma/schema.prisma
      # O webServer da suíte roda 'npm run build && next start'.
      - run: npx playwright test --project=api --workers=1
        working-directory: apps/pontufy
      #
      # A suíte de UI (`--project=e2e`) NÃO roda aqui ainda.
      #
      # Tentativa registrada: ela passou 13/14 localmente (1 `fixme`
      # documentado), mas no runner falhou por tempo — os gráficos do analytics
      # não montam dentro do timeout de 20 s. Job que fica vermelho por
      # timing é pior que job ausente: ensina o time a ignorar vermelho.
      #
      # Para estabilizar e então habilitar, faltam duas coisas:
      #   1. `npx playwright install --with-deps chromium` (sem isso o e2e
      #      falha com "Executable doesn't exist");
      #   2. timeouts e esperas explícitas por `recharts-surface` (o
      #      ResponsiveContainer depende de layout, não só de dado).
      #
      # Rodar localmente hoje: `npx playwright test --project=e2e` com
      # PW_BASE_URL apontando para um `next start`.